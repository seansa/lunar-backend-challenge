services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lunar
      MYSQL_USER: lunar
      MYSQL_PASSWORD: lunar
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=mysql://lunar:lunar@tcp(mysql:3306)/lunar"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
